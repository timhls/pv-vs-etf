[project]
name = "pv-vs-etf"
version = "0.1.0"
description = "Investment comparison calculator: rooftop/balcony PV system vs. ETF investment (German tax rules, IRR method)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "kaleido>=0.2.1",
]

[project.scripts]
pv-vs-etf = "pv_vs_etf.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_vs_etf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
